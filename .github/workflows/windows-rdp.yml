name: Windows Cloud RDP (Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Set Admin Password (from secret)
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $Env:RDP_PASSWORD) { throw "RDP_PASSWORD secret is empty" }
          net user runneradmin "$Env:RDP_PASSWORD"
          net localgroup "Remote Desktop Users" runneradmin /add
          Write-Host "Admin password configured from secret."

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          for ($i = 1; $i -le 20; $i++) {
            if (Test-Path $ts) { break }
            Start-Sleep -Seconds 3
          }
          if (-not (Test-Path $ts)) { throw "tailscale.exe not found after install" }
          & $ts up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --accept-routes
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed (exit $LASTEXITCODE)" }
          & $ts status

      - name: 4. Show Connection Info
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4 | Select-Object -First 1)
          $st = & $ts status --json | ConvertFrom-Json
          $name = $st.Self.DNSName
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Address   : $ip  (port 3389)" -ForegroundColor Yellow
          Write-Host "  MagicDNS  : $name" -ForegroundColor Yellow
          Write-Host "  Username  : runneradmin" -ForegroundColor Yellow
          Write-Host "  Password  : (see RDP_PASSWORD secret)" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          "IP=$ip`nDNS=$name" | Set-Content -Path "$env:RUNNER_TEMP\conn.txt" -Encoding ascii

      - name: 4b. Publish Connection Info
        uses: actions/upload-artifact@v4
        with:
          name: connection-info
          path: ${{ runner.temp }}/conn.txt
          if-no-files-found: error
          retention-days: 1

      - name: 5. Keep Alive (max ~6h)
        run: |
          for ($i = 1; $i -le 350; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/350] Server running..."
          }

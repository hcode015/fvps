name: Windows Cloud RDP (ngrok)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 2. Set Admin Password (from secret)
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: net user runneradmin "$Env:RDP_PASSWORD"

      - name: 3. Install & Start ngrok TCP Tunnel
        env:
          NGROK_AUTH: ${{ secrets.NGROK_AUTH }}
        run: |
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "C:\ngrok.zip"
          Expand-Archive -Path "C:\ngrok.zip" -DestinationPath "C:\ngrok" -Force
          Write-Host "ngrok version:"; & "C:\ngrok\ngrok.exe" version
          $out = & "C:\ngrok\ngrok.exe" config add-authtoken $Env:NGROK_AUTH 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) { throw "ngrok config add-authtoken failed (exit $code)" }
          Remove-Item "C:\ngrok.log" -ErrorAction SilentlyContinue
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log=C:\ngrok.log --log-level=info" -WindowStyle Hidden
          $ok = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $null = Invoke-RestMethod "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 3
              $ok = $true
              Write-Host "ngrok local API is up after $($i*2)s"
              break
            } catch {
              Write-Host "waiting for ngrok API... ($i/30)"
            }
          }
          if (Test-Path "C:\ngrok.log") { Write-Host "----- ngrok log (tail) -----"; Get-Content "C:\ngrok.log" -Tail 50 }
          if (-not $ok) { throw "ngrok local API did not come up on 127.0.0.1:4040 - see ngrok log above" }

      - name: 4. Show Connection Info
        run: |
          $tunnels = (Invoke-RestMethod "http://127.0.0.1:4040/api/tunnels").tunnels
          $addr = ($tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1).public_url -replace "tcp://",""
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Address   : $addr" -ForegroundColor Yellow
          Write-Host "  Username  : runneradmin" -ForegroundColor Yellow
          Write-Host "  Password  : (see RDP_PASSWORD secret)" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to the address above" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 5. Keep Alive (max ~6h)
        run: |
          for ($i = 1; $i -le 350; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/350] Server running..."
          }

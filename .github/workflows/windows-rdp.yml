name: Windows Cloud RDP (Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "PortNumber" -Value 3389
          sc.exe config TermService start= auto | Out-Host
          sc.exe config UmRdpService start= auto | Out-Host
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="RDP-TCP-3389" | Out-Null
          netsh advfirewall firewall add rule name="RDP-TCP-3389" dir=in action=allow protocol=TCP localport=3389 profile=any | Out-Host
          Start-Service UmRdpService -ErrorAction SilentlyContinue
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Service TermService -ErrorAction SilentlyContinue
          Get-Service TermService, UmRdpService | Format-Table Name, Status, StartType | Out-Host
          $ok = $false
          for ($i = 1; $i -le 15; $i++) {
            if (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue | Format-Table LocalAddress, LocalPort, State | Out-Host
          if (-not $ok) {
            Get-Service TermService -ErrorAction SilentlyContinue | Format-List Name, Status, StartType | Out-Host
            Get-WinEvent -LogName System -MaxEvents 40 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -like '*TerminalServices*' -or $_.Message -like '*TermService*' -or $_.Message -like '*3389*' } |
              Select-Object -First 6 TimeCreated, ProviderName, LevelDisplayName, Message | Format-List | Out-Host
            throw "RDP port 3389 is not listening after TermService restart"
          }

      - name: 2. Set Admin Password (fixed, from secret)
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $Env:RDP_PASSWORD) { throw "RDP_PASSWORD secret is empty" }
          net user runneradmin "$Env:RDP_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw "failed to set admin password" }
          net localgroup "Remote Desktop Users" runneradmin /add
          "RDP_PW=$Env:RDP_PASSWORD" | Set-Content -Path "$env:RUNNER_TEMP\pw.txt" -Encoding ascii
          Write-Host "Admin password set from secret."

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          for ($i = 1; $i -le 20; $i++) {
            if (Test-Path $ts) { break }
            Start-Sleep -Seconds 3
          }
          if (-not (Test-Path $ts)) { throw "tailscale.exe not found after install" }
          & $ts up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --accept-routes
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed (exit $LASTEXITCODE)" }
          & $ts status

      - name: 4. Show Connection Info
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4 | Select-Object -First 1)
          $st = & $ts status --json | ConvertFrom-Json
          $name = $st.Self.DNSName
          $pw = ((Get-Content "$env:RUNNER_TEMP\pw.txt") -replace '^RDP_PW=', '')
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Address   : $ip  (port 3389)" -ForegroundColor Yellow
          Write-Host "  MagicDNS  : $name" -ForegroundColor Yellow
          Write-Host "  Username  : runneradmin" -ForegroundColor Yellow
          Write-Host "  Password  : (sent by the bot)" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          "IP=$ip`nDNS=$name`nUSER=runneradmin`nPASSWORD=$pw" | Set-Content -Path "$env:RUNNER_TEMP\conn.txt" -Encoding ascii
          Write-Host "::add-mask::$pw"

      - name: 4b. Publish Connection Info
        uses: actions/upload-artifact@v4
        with:
          name: connection-info
          path: ${{ runner.temp }}/conn.txt
          if-no-files-found: error
          retention-days: 1

      - name: 5. Keep Alive (max ~6h)
        run: |
          for ($i = 1; $i -le 350; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/350] Server running..."
          }
